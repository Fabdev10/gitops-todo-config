apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "todo-app.fullname" . }}-db-migrate"
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
  annotations:
    # Helm eseguirà questo Job DOPO che tutte le risorse normali (ConfigMap, Secret,
    # StatefulSet postgres-db) sono state applicate al cluster.
    # In questo modo il container può leggere envFrom configMapKeyRef/secretKeyRef
    # senza incorrere nel CreateContainerConfigError del pre-install.
    # NOTA: post-install/post-upgrade garantisce che i manifest siano stati "applicati",
    # NON che i pod siano già Ready — il retry pg_isready gestisce questa finestra.
    "helm.sh/hook": post-install,post-upgrade
    # Peso positivo: parte dopo altri hook post-* con peso inferiore (es. weight "0").
    "helm.sh/hook-weight": "5"
    # Il Job viene eliminato automaticamente dopo il successo.
    # Sostituisci con "hook-failed,hook-succeeded" per tenerlo anche in caso di errore
    # e facilitare il debug con: kubectl logs -n <ns> -l app=db-migrate
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  # Aumentato a 300s: il pod Postgres può richiedere tempo per diventare Ready
  # dopo un'installazione fresh (download immagine + inizializzazione dati).
  activeDeadlineSeconds: 300
  template:
    metadata:
      name: "{{ include "todo-app.fullname" . }}-db-migrate"
      labels:
        app: db-migrate
    spec:
      restartPolicy: Never
      containers:
      - name: db-migrate
        image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
        env:
        - name: PGHOST
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: DB_HOST
        - name: PGPORT
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: DB_PORT
        - name: PGDATABASE
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: DB_NAME
        - name: PGUSER
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: DB_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        command:
        - /bin/sh
        - -c
        - |
          set -eo pipefail
          echo "=== DB Migration Hook: verifica connessione a $PGHOST:$PGPORT ==="

          # Attendi che il DB sia pronto.
          # max 90 tentativi × 2s = 180s di attesa totale (dentro i 300s del deadline).
          # pg_isready torna exit 0 solo quando Postgres accetta connessioni TCP;
          # questo copre sia la fase di avvio del pod sia il caso in cui il pod
          # sia stato schedulato ma l'init di PostgreSQL non ha ancora finito.
          RETRIES=90
          until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do
            if [ $RETRIES -eq 0 ]; then
              echo "ERROR: Postgres non raggiungibile dopo il timeout. Aborting migration."
              exit 1
            fi
            echo "Waiting for postgres... ($RETRIES tentativi rimasti)"
            sleep 2
            RETRIES=$((RETRIES-1))
          done

          echo "=== Postgres raggiungibile. Esecuzione migrazione/verifica schema... ==="

          # Esempio: verifica che la tabella 'todos' esista (adatta al tuo schema reale)
          psql -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" -c "
            CREATE TABLE IF NOT EXISTS todos (
              id SERIAL PRIMARY KEY,
              title TEXT NOT NULL,
              completed BOOLEAN DEFAULT FALSE,
              created_at TIMESTAMP DEFAULT NOW()
            );
          "

          echo "=== Migrazione completata con successo. ==="
