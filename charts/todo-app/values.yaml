# Default values for todo-app chart.

global:
  environment: dev

# ConfigMap & Secret settings
config:
  dbHost: "postgres-service"
  dbPort: "5432"
  dbName: "todo_db"
  dbUser: "postgres"
  port: "5000"
  dbPassword: "postgrespass"

# Frontend Deployment
frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/fabdev10/todo-frontend
    tag: sha-15c6e5431dc4a4966f43f790ee487c3c18206df0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources: {}

# Backend Deployment
backend:
  replicaCount: 1
  image:
    repository: ghcr.io/fabdev10/todo-backend
    tag: sha-15c6e5431dc4a4966f43f790ee487c3c18206df0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Postgres DB StatefulSet
postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  storage:
    storageClassName: local-path
    size: 1Gi

# Horizontal Pod Autoscaler for Backend
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  host: todo.local
  tls:
    enabled: true
    secretName: todo-tls
    clusterIssuer: selfsigned-issuer

# Backup CronJob configuration
backup:
  cronjob:
    enabled: true
    schedule: "0 2 * * *"
    storageClassName: local-path
    storageSize: 2Gi

# Network Policies
networkPolicy:
  enabled: true

# RBAC & Service Accounts
rbac:
  create: true
