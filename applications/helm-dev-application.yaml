apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-app-helm-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Fabdev10/gitops-todo-config.git
    targetRevision: main
    path: charts/todo-app
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: todo-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
